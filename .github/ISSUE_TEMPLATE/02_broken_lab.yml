name: 🐛 Broken Lab / Bug Report
description: Report a broken step, failed command, container error, or version incompatibility in a lab.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please report issues encountered while running commands or setting up lab environments.
        **Do NOT include private credentials, PAT tokens, or client secrets in logs.**

  - type: dropdown
    id: bootcamp
    attributes:
      label: Bootcamp Track
      description: Select the affected bootcamp.
      options:
        - "🔀 Kong API Gateway Bootcamp"
        - "🤖 Kong AI Gateway 2.x Bootcamp"
        - "🛠️ Kong Agentic AI Bootcamp"
        - "🔄 Kong APIOps & decK Bootcamp"
        - "🌐 Kong Developer Portal Bootcamp"
        - "🎮 Kong Insomnia Bootcamp"
        - "🤝 Bring Your Own Agent (BYOA) Bootcamp"
        - "🌋 Volcano Agent SDK Bootcamp"
        - "🕸️ Kong Service Mesh Bootcamp"
        - "⚡ Kong Event Gateway Bootcamp"
        - "💳 Kong Metering & Billing Bootcamp"
        - "🎓 Kong Certification Practice (KGCA / KKA)"
    validations:
      required: true

  - type: input
    id: module_lab
    attributes:
      label: Module & Lab Number
      description: "E.g., Module 03, Lab 02: Rate Limiting & Proxy Cache"
      placeholder: "Module XX, Lab YY"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Tools
      description: OS version, Docker version, Kong Gateway version, decK / kongctl version.
      placeholder: "macOS 15.2, Docker 27.x, Kong Gateway 3.15, decK 1.43"
    validations:
      required: false

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Detail the exact commands you executed before the failure.
      placeholder: |
        1. Executed `docker compose up -d`
        2. Ran `deck gateway diff -s kong.yaml`
        3. Received error...
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Terminal Output / Error Logs
      description: Paste the sanitized console output or stack trace (strip all tokens/secrets).
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened according to the lab guide?
    validations:
      required: false
